name: agroscan
description: Real-time, crop-agnostic plant disease detection app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.10.4
  camera: ^0.10.5
  drift: ^2.13.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.18
  connectivity_plus: ^5.0.1
  flutter_tts: ^3.8.3
  workmanager: ^0.5.2
  geolocator: ^10.1.0
  http: ^1.1.0
  image: ^4.1.3
  crypto: ^3.0.3
  uuid: ^4.2.0
  riverpod: ^2.4.3
  flutter_riverpod: ^2.4.3
  go_router: ^12.1.1
  fl_chart: ^0.65.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  permission_handler: ^11.0.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  drift_dev: ^2.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/heads/
    - assets/db/diseases.db
    - assets/icons/crops/
    - assets/i18n/
